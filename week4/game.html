<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Week 4 · Star Catcher</title>
    <link rel="stylesheet" href="styles.css">
    <script src="game.js" defer></script>
  </head>
  <body>
    <div class="wrap game-shell">
      <header>
        <h1>Star Catcher</h1>
        <p>Catch the falling stars, dodge the rocks. Move the basket with your mouse or your finger.</p>
      </header>

      <div class="hud">
        <div><span class="label">Score</span> <span id="score" class="value">0</span></div>
        <div><span class="label">Lives</span> <span id="lives" class="value">3</span></div>
        <div><span class="label">Time</span> <span id="time" class="value">30</span>s</div>
      </div>

      <canvas id="game" width="640" height="400" aria-label="Star Catcher game area"></canvas>

      <div class="controls">
        <button type="button" id="start">Start</button>
      </div>
      <p id="result" class="result"></p>

      <footer>
        <nav class="page-links" aria-label="Other week 4 pages">
          <a href="index.html">Back to the explorer</a>
          <a href="statistics.html">See the data</a>
          <a href="../index.html">Back to the home page</a>
        </nav>
        <p>Game built with the HTML canvas element.</p>
      </footer>
    </div>
  </body>
</html>
